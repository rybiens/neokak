[package]
name = "neokak"
version = "0.2.0"
edition = "2024"
rust-version = "1.88"
description = "A Neovim-style IDE frontend for Kakoune"
license = "MIT OR Apache-2.0"

[dependencies]
anyhow = "1.0.104"
crossterm = "0.29.0"
ignore = "0.4.33"
nucleo = "0.5.0"
portable-pty = "0.9.0"
ratatui = "0.30.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
signal-hook = "0.4.5"
toml_edit = "0.25.17"
unicode-width = "0.2.2"
vt100 = "0.16.2"

[dev-dependencies]
tempfile = "3.27.0"

[profile.release]
strip = true
lto = "thin"
