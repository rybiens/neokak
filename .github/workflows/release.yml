name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  TARGET: x86_64-unknown-linux-musl

jobs:
  release:
    name: Build and publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ env.TARGET }}

      - name: Check the tag matches Cargo.toml
        run: |
          version=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tag $GITHUB_REF_NAME doesn't match Cargo.toml version $version"
            exit 1
          fi

      # Static musl binary: runs on any Linux distribution.
      - name: Build
        run: cargo build --locked --release --target "$TARGET"

      - name: Package
        run: |
          name="neokak-$GITHUB_REF_NAME-x86_64-linux"
          mkdir "$name"
          cp "target/$TARGET/release/neokak" README.md CHANGELOG.md LICENSE-MIT LICENSE-APACHE "$name/"
          tar czf "$name.tar.gz" "$name"
          sha256sum "$name.tar.gz" > "$name.tar.gz.sha256"
          # This version's section of the changelog becomes the release notes.
          awk -v v="## $GITHUB_REF_NAME" '$0 == v {on=1; next} /^## / {on=0} on' CHANGELOG.md > notes.md
          test -s notes.md || echo "See CHANGELOG.md." > notes.md

      - uses: softprops/action-gh-release@v2
        with:
          name: neokak ${{ github.ref_name }}
          body_path: notes.md
          files: |
            neokak-*.tar.gz
            neokak-*.tar.gz.sha256
